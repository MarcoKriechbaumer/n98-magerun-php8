---
name: Deploy

on:
  push:
    tags:
      # only tags with semver format
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-phar-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HEAD
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          tools: composer:2
          php-version: '8.2'

      # the tag must match version.txt and the application version, self-update compares against the release tag
      - name: Check versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION_TXT=$(tr -d '[:space:]' < version.txt)
          APP_VERSION=$(sed -n "s/.*APP_VERSION = '\(.*\)';/\1/p" src/N98/Magento/Application.php)
          echo "tag: ${TAG}, version.txt: ${VERSION_TXT}, application: ${APP_VERSION}"
          test "${TAG}" = "${VERSION_TXT}"
          test "${TAG}" = "${APP_VERSION}"

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Create phar
        run: bash ./build.sh

      - name: Run phar file
        run: php n98-magerun.phar --version

      - name: Create checksum
        run: sha256sum n98-magerun.phar > n98-magerun.phar.sha256

      # Claude skill with a command reference generated from this phar
      - name: Package Claude skill
        run: |
          php n98-magerun.phar list --format=json > commands.json
          php res/claude-skill/generate-reference.php commands.json res/claude-skill/n98-magerun/references/commands.md
          (cd res/claude-skill && zip -r ../../n98-magerun.skill n98-magerun)

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: n98-magerun.phar
          path: |
            n98-magerun.phar
            n98-magerun.phar.sha256
            n98-magerun.skill

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for the changes." \
            n98-magerun.phar n98-magerun.phar.sha256 n98-magerun.skill
