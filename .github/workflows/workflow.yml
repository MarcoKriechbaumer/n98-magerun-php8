name: CI

on:
  push:
  pull_request:

jobs:
  composer:
    name: Composer
    uses: ./.github/workflows/composer.yml

  php_compatibility:
    name: Composer
    uses: ./.github/workflows/php_compatibility.yml

  php-cs-fixer:
    name: PHP CS Fixer
    needs: [composer]
    uses: ./.github/workflows/php-cs-fixer.yml

  phpstan:
    name: PHPStan
    needs: [composer, php-cs-fixer]
    uses: ./.github/workflows/phpstan.yml

  rector:
    name: Rector
    needs: [composer, php-cs-fixer]
    # rector commits its changes to the pull request branch
    permissions:
      contents: write
    uses: ./.github/workflows/rector.yml

  unit_tests_om_20_10:
    name: PHPUnit OpenMage 20.10
    needs: [composer, php-cs-fixer, phpstan, rector]
    # rector runs on pull requests only, do not skip the tests when it was skipped
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/test-openmage-20.10.yml

  unit_tests_om_latest:
    name: PHPUnit OpenMage 20.x
    needs: [composer, php-cs-fixer, phpstan, rector]
    # rector runs on pull requests only, do not skip the tests when it was skipped
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/test-openmage-latest.yml

  build_phar:
    name: Build Phar
    needs: [composer, php-cs-fixer, phpstan, rector, unit_tests_om_20_10, unit_tests_om_latest]
    # rector runs on pull requests only, do not skip the tests when it was skipped
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/phar_build_and_update.yml
